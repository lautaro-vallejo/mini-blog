# Blueprint de Render (opcional): crea la base de datos y el servicio web juntos.
# Dashboard de Render -> New -> Blueprint -> elegir este repositorio.
databases:
  - name: mdp-futbolera-db
    plan: free
    databaseName: miniblog
    user: miniblog

services:
  - type: web
    name: mdp-futbolera-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mdp-futbolera-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALG
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "3"
