<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mar del Plata Futbolera</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <nav>
    <div>
      <a href="index.html" class="logo">⚽ MdP Futbolera</a>
      <a href="index.html">Inicio</a>
      <a href="nuevo.html">Escribir post</a>
    </div>
    <div id="usuario"></div>
  </nav>

  <header class="portada">
    <h1>Mar del Plata Futbolera</h1>
    <p>Aldosivi, Alvarado, la Liga Marplatense y todo el fútbol de la costa</p>
  </header>

  <main>
    <div class="filtros">
      <!-- Los botones de categorías se agregan desde inicio.js -->
      <div id="categorias"></div>
      <input type="text" id="buscador" placeholder="Buscar por título...">
    </div>

    <div id="posts">
      <p class="mensaje">Cargando posts...</p>
    </div>

    <div class="paginacion">
      <button id="anterior">← Anterior</button>
      <span id="pagina"></span>
      <button id="siguiente">Siguiente →</button>
    </div>
  </main>

  <footer>Mar del Plata Futbolera · Proyecto hecho con FastAPI</footer>

  <script src="comun.js"></script>
  <script src="inicio.js"></script>
</body>
</html>
